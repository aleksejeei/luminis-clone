name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: List schemes (debug)
        run: xcodebuild -list -project YSTU_APP/YSTU_APP.xcodeproj

      - name: Build unsigned .app
        run: |
          xcodebuild build \
            -project YSTU_APP/YSTU_APP.xcodeproj \
            -scheme YSTU_APP \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ONLY_ACTIVE_ARCH=NO

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -R "DerivedData/Build/Products/Release-iphoneos/YSTU_APP.app" Payload/
          zip -r Luminis-unsigned.ipa Payload
          ls -lh Luminis-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Luminis-unsigned-ipa
          path: Luminis-unsigned.ipa
